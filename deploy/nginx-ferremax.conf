# FerreMax: tienda React compilada + API FastAPI en el mismo dominio.
# __DOMINIO__ lo reemplaza instalar_servidor.sh; certbot agrega luego el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    root /opt/ferremax/app/frontend/dist;
    index index.html;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API y documentación del backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # reentrenar y la evaluación offline tardan unos segundos
    }
    location ~ ^/(docs|openapi\.json|redoc)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Archivos estáticos con caché
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /img/    { expires 30d; try_files $uri =404; }

    # Rutas de la SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
